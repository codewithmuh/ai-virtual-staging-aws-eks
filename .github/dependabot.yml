# Weekly, grouped updates so dependency PRs stay reviewable. Pinned action SHAs are updated too.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: uv
    directory: /services/api
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"] }

  - package-ecosystem: docker
    directory: /services/api
    schedule: { interval: weekly }
    ignore:
      # Moving to a new Python (3.13 -> 3.14) is a deliberate upgrade: pyproject.toml, .python-version
      # and uv.lock pin 3.13, so the image must change with them, in one pull request.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      base-images: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /services/web
    schedule: { interval: weekly }
    groups:
      web: { patterns: ["*"] }

  - package-ecosystem: docker
    directory: /services/web
    schedule: { interval: weekly }
    ignore:
      # A new Node major (24 -> 26) is a deliberate upgrade, made together with .nvmrc.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    groups:
      base-images: { patterns: ["*"] }
